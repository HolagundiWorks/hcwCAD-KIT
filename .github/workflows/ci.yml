name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    name: Unit tests (CAD-free logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/HCW.Logic.Tests/HCW.Logic.Tests.csproj --nologo

  compile-check:
    name: Compile against AutoCAD.NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build build/CompileCheck.csproj --nologo -v q
